  flutter_spinkit: ^5.1.0
  custom_pop_up_menu: ^1.2.4
  dotted_border: ^2.0.0+1
  flutter_switch: ^0.3.2
  flyy_flutter_plugin: 1.1.41
  percent_indicator: ^3.4.0
  expand_widget: ^2.1.0
  image_picker: ^0.8.4
  image_cropper: ^1.4.1
  file_picker: ^4.3.0
  url_launcher: ^6.0.17
  fluttertoast: ^8.1.1
  modal_progress_hud_nsn: ^0.3.0
  http: ^0.13.5
  shared_preferences: ^2.0.13
  intl: ^0.17.0
  connectivity_plus: ^2.2.0
  webviewx: ^0.2.1
  go_router: ^3.0.1
  provider: ^6.0.3
  pin_code_fields: ^7.3.0
  dio:
  printing: ^5.9.3
#  open_file:
  open_file_safe: ^3.2.3
  webview_flutter:
  just_audio: ^0.9.20
  shimmer:
  otp_autofill: ^4.1.0



  firebase_core: ^2.3.0
  firebase_messaging: ^14.1.1
  firebase_crashlytics: ^3.0.6
  device_information: ^0.0.4

#used when requirements came
  location: ^4.4.0
  dart_ipify: ^1.1.1
  flutter_local_notifications: ^12.0.4
#  permission_handler: ^9.2.0

  flutter_countdown_timer:
  package_info_plus: ^1.0.6

  path_provider:
  in_app_review: ^2.0.4
  appsflyer_sdk: ^6.5.2+2
  local_auth: ^2.1.0
  syncfusion_flutter_charts: ^20.3.52
  syncfusion_flutter_maps: ^20.3.48
  universal_html: ^2.0.8
  youtube_player_flutter: ^8.1.1
  syncfusion_flutter_sliders: ^20.3.56
  syncfusion_flutter_core: ^20.3.56
  pdf: ^3.8.4
  dropdown_button2: ^1.9.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FBFCF9"
    theme_color: "#006B4C"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
#    - assets/
    - images/
    - sounds/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800