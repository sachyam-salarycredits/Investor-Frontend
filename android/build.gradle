buildscript {
    ext.kotlin_version = '1.6.10'
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.3.14'
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()

        // Flyy Integration step
        maven {
            url 'https://jitpack.io'
            credentials { username authToken }
        }

        // SFMC integration
        maven {
            url "https://salesforce-marketingcloud.github.io/MarketingCloudSDK-Android/repository"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    subproject.buildscript {
        configurations.classpath {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.10"
            }
        }
    }
}

// Plugins that declare compileSdk 35 are built with an aapt2 that cannot
// read the installed Android 35 platform. Keep every module on 34.
subprojects { subproject ->
    if (subproject.state.executed) {
        return
    }
    subproject.afterEvaluate {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileSdkVersion(34)
        }
        // JDK 17 turns these plugins' deprecation warnings into errors.
        subproject.tasks.withType(JavaCompile).configureEach {
            options.compilerArgs.removeAll(["-Werror"])
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
